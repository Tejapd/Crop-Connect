{% extends "officer/officer_home.html" %}

{% block content %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'officer/officer_add_rainfall.css' %}">

<div class="content">

    <form method="POST">
        {% csrf_token %} 
        <div class="container">
            <h1><u>ADD RAINFALL DETAILS</u></h1>

        }

</style>
{% endblock %}
